name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Select native compiler
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Join-Path $env:MSYS2_LOCATION 'mingw64/bin' | Add-Content $env:GITHUB_PATH
      - name: Verify version and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: ./tools/verify-version.ps1 -Tag $env:RELEASE_TAG
      - name: Prepare SDR# references
        env:
          SDRSHARP_DOWNLOAD_URL: ${{ vars.SDRSHARP_DOWNLOAD_URL }}
          SDRSHARP_SHA256: ${{ vars.SDRSHARP_SHA256 }}
        run: |
          $options=@{}
          if($env:SDRSHARP_DOWNLOAD_URL) {$options.Url=$env:SDRSHARP_DOWNLOAD_URL}
          if($env:SDRSHARP_SHA256) {$options.Sha256=$env:SDRSHARP_SHA256}
          ./tools/setup-sdk.ps1 @options
      - name: Install test dependencies
        run: |
          python -m pip install numpy safetensors
          if($LASTEXITCODE) {exit $LASTEXITCODE}
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          if($LASTEXITCODE) {exit $LASTEXITCODE}
      - name: Build
        run: ./tools/build.ps1
      - name: Test DSP, privacy, cache and SDR# integration
        run: ./tools/check.ps1
      - name: Package and audit
        run: |
          ./tools/package.ps1 -Output artifacts/release
          python tools/check-package.py artifacts/release
          if($LASTEXITCODE) {exit $LASTEXITCODE}
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          if-no-files-found: error
          compression-level: 0
          path: |
            artifacts/release/STD-T98-Receiver.zip
            artifacts/release/std-t98-receiver-sharp-source.zip
            artifacts/release/SHA256SUMS.txt

  publish:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - name: Attach packages to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/STD-T98-Receiver.zip release/std-t98-receiver-sharp-source.zip release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
